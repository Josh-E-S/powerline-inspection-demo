name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install numpy pillow

      - name: Lint
        run: ruff check scripts app tests

      - name: Format check
        run: ruff format --check scripts app tests

      - name: Tests
        run: pytest tests -q

      - name: Compile all scripts
        run: python -m compileall -q scripts app

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: pip install pip-audit bandit

      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt --skip-editable || true

      - name: Static security scan
        run: bandit -q -r scripts app -ll
